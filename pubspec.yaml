name: chatwoot_sdk
description: A flutter client sdk for chatwoot. Integrate Chatwoot flutter client into your flutter app and talk to your visitors/users in real time.
version: 0.0.10
homepage: https://github.com/chatwoot/chatwoot-flutter-sdk

environment:
  sdk: ">=2.12.0 <3.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2
  flutter_chat_ui: ^1.1.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  web_socket_channel: ^3.0.1
  json_annotation: ^4.0.1
  dio: ^5.7.0
  equatable: ^2.0.3
  riverpod: ^2.5.1
  synchronized: ^3.0.0
  intl: ^0.19.0
  flutter_chat_types: ^3.6.2
  stream_channel: ^2.1.0
  async: ^2.5.0
  webview_flutter: ^4.0.6
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.1.10
  path_provider: ^2.0.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.3.2
  json_serializable: ^6.6.1
  hive_generator: ^2.0.0
  build_runner: ^2.3.3
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.chatwoot.chatwoot_sdk
        pluginClass: ChatwootSdkPlugin
      ios:
        pluginClass: ChatwootSdkPlugin
      web:
        pluginClass: ChatwootSdkWeb
        fileName: chatwoot_sdk_web.dart

  assets:
    - assets/
